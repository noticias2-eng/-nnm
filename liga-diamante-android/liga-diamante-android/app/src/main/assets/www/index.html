<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liga Diamante</title>
<style>
:root{--bg:#eef2ee;--ink:#14261c;--pn:#fff;--ln:#cdd8cf;--fd:#1f5c3f;--dt:#a5603a;--mu:#5a6b60;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a13;--ink:#e6efe8;--pn:#14261c;--ln:#27402f;--fd:#3d9a6b;--dt:#d08a5a;--mu:#92a698;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1a13;--ink:#e6efe8;--pn:#14261c;--ln:#27402f;--fd:#3d9a6b;--dt:#d08a5a;--mu:#92a698;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif;max-width:760px;margin-inline:auto;padding:12px}
h1{font:700 1.5rem/1.1 Georgia,"Times New Roman",serif;margin:6px 0 2px}
h2{font:700 1.05rem Georgia,serif;margin:18px 0 6px;color:var(--fd)}
.sub{color:var(--mu);margin:0 0 10px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
select,button{font:inherit;padding:8px 10px;border-radius:6px;border:1px solid var(--ln);background:var(--pn);color:var(--ink)}
button{background:var(--fd);color:#fff;border-color:var(--fd);font-weight:700}
button.alt{background:var(--pn);color:var(--ink);border-color:var(--ln)}
button:focus-visible,select:focus-visible{outline:3px solid var(--dt);outline-offset:2px}
.tabs{display:flex;gap:6px;margin:10px 0}.tabs button{flex:1}
.tabs button[aria-selected="false"]{background:var(--pn);color:var(--ink);border-color:var(--ln)}
.sc{overflow-x:auto;background:var(--pn);border:1px solid var(--ln);border-radius:8px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:5px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--ln)}
th:first-child,td:first-child{text-align:left}th{color:var(--mu);font-weight:600}
td.w{font-weight:700;color:var(--dt)}
#log{max-height:260px;overflow:auto;background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:6px 10px;margin:0;list-style:none;font-size:13px}
#log li{padding:2px 0;border-bottom:1px dashed var(--ln)}
.lg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.lg>div{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:6px 10px}
.lg h3{margin:2px 0 4px;font-size:.95rem}
.lg p{margin:0;display:flex;justify-content:space-between;gap:8px}
.hide{display:none}
.ser{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;border-bottom:1px solid var(--ln);background:var(--pn)}.ser b{color:var(--dt);text-align:right}
.bar button{flex:1 1 auto}
td button{padding:2px 8px;font-size:13px;margin-left:3px}
.tabs button{padding:8px 2px;font-size:13px}.fm{display:grid;gap:8px}.fm label{display:flex;gap:8px;align-items:center;justify-content:space-between}.fm input,.fm select{max-width:58%;font:inherit;padding:6px;border:1px solid var(--ln);border-radius:6px;background:var(--pn);color:var(--ink)}.fm input[type=range]{padding:0}
.gb{position:relative;height:28px;border:1px solid var(--ln);border-radius:6px;background:var(--pn);overflow:hidden;margin:8px 0 2px}.gb b{position:absolute;left:40%;width:20%;top:0;bottom:0;background:var(--fd);opacity:.4}.gb i{position:absolute;top:0;bottom:0;width:8%;background:var(--dt);left:0}
button{min-height:42px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
td button{min-height:34px}
select,input,textarea{font-size:16px}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0;margin:0 0 6px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.ser{flex-wrap:wrap;align-items:center}.ser>span{min-width:0;flex:1 1 150px}.ser button{margin:2px}
.sc table{font-size:14px}
@media (max-width:420px){body{padding:8px}h1{font-size:1.3rem}.tabs button{font-size:12px}}
</style></head><body>
<h1>Liga Diamante</h1>
<p class="sub">Simulación de béisbol con carrera, club, cartas y más.</p><p id="tip" class="sub"></p>
<div class="tabs" role="tablist">
<button role="tab" data-t="g" aria-selected="true">Partido</button>
<button role="tab" data-t="s" aria-selected="false">Temporada</button>
<button role="tab" data-t="l" aria-selected="false">Líderes</button>
<button role="tab" data-t="r" aria-selected="false">Franquicia</button>
<button role="tab" data-t="m" aria-selected="false">Modos</button></div>

<section id="g">
<div class="bar"><select id="aw" aria-label="Visitante"></select><span>en</span><select id="hm" aria-label="Local"></select></div>
<div class="bar"><button id="play">Jugar exhibición</button><button id="man">Jugar manual</button></div>
<div class="bar"><select id="mm" aria-label="Modo manual"><option value="all">Todos los turnos</option><option value="chance">Solo oportunidades</option><option value="7">Desde la 7.ª entrada</option></select><select id="mu" aria-label="Equipo que controlas"><option value="0">Controlo al visitante</option><option value="1">Controlo al local</option></select></div>
<div id="res"><p class="sub">Exhibición: estos partidos libres no cuentan para la temporada.</p></div>
</section>
<section id="m" class="hide"><div class="bar"><button data-md="d">Derby</button><button data-md="t" class="alt">Torneo</button><button data-md="c" class="alt">Crear jugador</button><button data-md="r" class="alt">Carrera</button><button data-md="b" class="alt">Mi carrera</button><button data-md="e" class="alt">Tienda</button><button data-md="q" class="alt">Misiones</button><button data-md="h" class="alt">Habilidades</button><button data-md="p" class="alt">Pitcheos</button><button data-md="f" class="alt">Salón</button><button data-md="k" class="alt">Club</button><button data-md="x" class="alt">Datos</button><button data-md="i" class="alt">Ayuda</button></div><div id="mo"></div></section>
<section id="s" class="hide"><div id="sea"></div></section>
<section id="l" class="hide"><div id="lead"></div></section>
<section id="r" class="hide"><div class="bar"><select id="rt" aria-label="Equipo"></select></div><p id="msg" class="sub" role="status"></p><div id="pf"></div><div id="ros"></div><div id="fa"></div></section>

<script>
let uid=0;
const R=Math.random,rnd=(a,b)=>a+Math.floor(R()*(b-a+1)),cl=(x,a,b)=>Math.max(a,Math.min(b,x)),pick=a=>a[rnd(0,a.length-1)];
const FN=['Luis','Mateo','Darío','Iván','Tomás','Rafa','Hugo','Nico','Saúl','Abel','Omar','Joel','Andrés','Bruno'];
const LN=['Ramos','Vega','Soto','Cruz','Mora','Paz','Ibarra','Rey','Salas','Lugo','Nava','Ortiz','Peña','Rivas','Zamora','Cano','Bravo','Toro','Luna','Páez'];
const POS=['C','1B','2B','3B','SS','LF','CF','RF','DH'];
const nm=()=>pick(FN)+' '+pick(LN);
const mkB=pos=>({id:++uid,name:nm(),pos,con:rnd(42,82),pow:rnd(35,85),eye:rnd(40,80),spd:rnd(35,85),fld:rnd(40,80),s:{},g:{}});
const mkP=(rol)=>({id:++uid,name:nm(),pos:rol,vel:rnd(45,85),ctl:rnd(40,80),mov:rnd(40,80),sta:rol=='SP'?rnd(75,105):100,s:{},g:{}});
const TN=['Tigres de Bahía','Halcones del Norte','Gigantes del Valle','Marineros del Sur','Cóndores','Toros de Acero','Piratas del Puerto','Lobos de Sierra'];
const ovr=p=>p.vel?Math.round((p.vel+p.ctl+p.mov)/3):Math.round((p.con*1.2+p.pow*1.2+p.eye+p.spd*.6+p.fld*.6)/4.6);
const mkt=p=>Math.round(Math.max(.5,(ovr(p)-40)*.45)*10)/10;
const sign=(p,y)=>{if(!p.age){p.age=rnd(20,36);p.pot=ovr(p)+(p.age<27?rnd(2,14):rnd(0,3));p.sn=0}p.sal=mkt(p);p.yrs=y||rnd(1,4);return p};
const teams=TN.map(n=>({n,bat:POS.map(mkB).map(p=>sign(p)).sort((a,b)=>b.con+b.eye-a.con-a.eye).concat([0,1].map(()=>{const p=mkB(pick(POS));['con','pow','eye','spd','fld'].forEach(k=>p[k]-=rnd(8,16));return sign(p)})),pit:[0,1,2,3,4].map(()=>sign(mkP('SP'))).concat([0,1].map(()=>sign(mkP('RP')))),w:0,l:0,rs:0,ra:0,rot:0}));
let PO=false;
const add=(p,k,v=1)=>{if(!PO)p.s[k]=(p.s[k]||0)+v;p.g[k]=(p.g[k]||0)+v};

function playGame(A,H){const g=gameGen(A,H);let r=g.next();while(!r.done)r=g.next();return r.value}
function* gameGen(A,H,ctl){
 const T=[A,H],S=[0,0],sc=[[],[]],log=[],ord=[0,0],cur=[stp(A),stp(H)],L=[lin(A),lin(H)],used=new Set(),dvu=[0,0],pc=[0,0];
 T.forEach(t=>[...t.bat,...t.pit].forEach(p=>p.g={}));
 cur.forEach(p=>add(p,'gp'));
 let inn=0;
 while(inn<20){inn++;
  for(let b=0;b<2;b++){
   const d=1-b;
   if(inn>=9&&b==1&&S[1]>S[0]){sc[1][inn-1]='X';break}
   let outs=0,runs=0,bases=[null,null,null];
   while(outs<3&&!(inn>=9&&b==1&&S[1]>S[0])){
    let B=L[b][ord[b]++%9];let P=cur[d];
    if(pc[d]>=P.sta&&T[d].pit.indexOf(P)<5){P=cur[d]=rlv(T[d]);pc[d]=0;add(P,'gp');log.push(`Cambio de lanzador en ${T[d].n}: entra ${P.name}`)}
    const scr=(run,rbi,err)=>{add(run,'r');S[b]++;runs++;if(rbi)add(B,'rbi');if(!err)add(P,'er')};
    let bl=0,st=0,sq='',res='',txt='',QQ=.5,mdf=false,mof=false,dv=0;
    const info=()=>({inn,b,outs,bl,st,sq,bases:bases.map(x=>x&&x.name),B,P,pc:pc[d],S:[...S],log,bench:[],pen:[]});
    while(!res){
     const on=ctl&&ctl.side>=0&&inn>=(ctl.from||1)&&(ctl.mode!='chance'||bases[1]||bases[2]);
     let mb=on&&ctl.side==b,mp=on&&ctl.side==d,dec=null;if(ctl&&ctl.p){const pp=!!ctl.p.vel;if(pp){mp=mp&&P===ctl.p;mb=false}else{mb=mb&&B===ctl.p;mp=false}}
     if(mb||mp){dec=yield{t:mb?'bat':'pit',inn,b,outs,bl,st,sq,bases:bases.map(x=>x&&x.name),B,P,pc:pc[d],S:[...S],log,bench:mb?T[b].bat.filter(p=>!L[b].includes(p)&&!p.inj&&!used.has(p)):[],pen:mp?T[d].pit.filter(p=>!p.inj&&p!==P&&!used.has(p)):[]};if(dec.auto)mb=mp=false;else if(dec.sub){const s=dec.sub;
      if(s.k=='ph'&&mb){const n=T[b].bat.filter(p=>!L[b].includes(p)&&!p.inj&&!used.has(p))[s.i];if(n){used.add(B);L[b][L[b].indexOf(B)]=n;add(n,'gp');log.push(`Bateador emergente: ${n.name} por ${B.name}`);B=n}}
      else if(s.k=='pr'&&mb){const n=T[b].bat.filter(p=>!L[b].includes(p)&&!p.inj&&!used.has(p))[s.i],o=bases[s.r];if(n&&o){used.add(o);L[b][L[b].indexOf(o)]=n;bases[s.r]=n;add(n,'gp');log.push(`Corredor emergente: ${n.name} por ${o.name}`)}}
      else if(s.k=='pc'&&mp){const n=T[d].pit.filter(p=>!p.inj&&p!==P&&!used.has(p))[s.i];if(n){used.add(P);P=cur[d]=n;pc[d]=0;add(n,'gp');log.push(`Relevo: ${n.name} (${T[d].n})`)}}}}
     mdf=mp&&!(ctl&&ctl.p);mof=mb&&!(ctl&&ctl.p);const r1=bases[0];
     if(mb?(dec.steal&&r1&&!bases[1]):(r1&&!bases[1]&&outs<2&&R()<.035*r1.spd/50)){
      let tq=0;if(mdf&&!mb){const td=yield{...info(),t:'thr'};if(td.a=='throw')tq=.18*(td.q??.5)}
      if(R()<.55+r1.spd/300+mod(r1,'steal')-tq){add(r1,'sb');bases[1]=r1;bases[0]=null;sq+='r'}
      else{add(r1,'cs');bases[0]=null;outs++;add(P,'out');sq+='x';if(outs>=3)res='cs'}
      if(res)break}
     if(mb&&dec.steal3&&bases[1]&&!bases[2]){const r2=bases[1];if(R()<.45+r2.spd/400+mod(r2,'steal')){add(r2,'sb');bases[2]=r2;bases[1]=null;sq+='r'}else{add(r2,'cs');bases[1]=null;outs++;add(P,'out');sq+='x';if(outs>=3)res='cs'}if(res)break}
     const fat=cl((pc[d]-P.sta)/50,0,.3);pc[d]++;
     let zp=.46+(P.ctl-50)/300-fat+mod(P,'zone')+(P.bu>0?.03:0),qb=.5,ca=0;
     if(mp){const q=(dec.q??.5)*(ctl.cf||1),tg=dec.tg;zp=(tg=='z'?.54:tg=='e'?.43:.1)+(P.ctl-50)/300+(q-.5)*.45-fat+mod(P,'zone')+cpFx(P,dec.pt).zp;ca=(P[{f:'vel',c:'mov',s:'ctl'}[dec.pt]||'ctl']-50)/400+(tg=='e'?.06:tg=='z'?-.05:0)+(q-.5)*.12+cpFx(P,dec.pt).ca}
     if(mb)qb=(dec.q??.5)*(ctl.cf||1);
     if(!mp&&P.cp&&P.cp.length&&R()<.4){const f=cpFx(P,'x'+rnd(0,P.cp.length-1));zp+=f.zp;ca+=f.ca}
     const zone=R()<zp;
     if(mb&&dec.a=='bunt'){if(R()<.7+(B.con-50)/400+mod(B,'bunt')-(zone?0:.25)){res='bunt';sq+='b'}else{sq+='F';if(st>=2)res='k';else st++}}
     else if(mb?dec.a=='swing':R()<(zone?.72:cl(.32-(B.eye-50)/250,.08,.5))){
      const cont=Math.min(.97,cl(.76+(B.con-50)/220-(P.vel+P.mov-100)/350-fat/2-(zone?0:.18)-ca+(has(B,'clutch')&&(bases[1]||bases[2])?.06:0)-mod(P,'ctlc')+mod(B,'cont')+(B.bu>0?.05:0)+(T[b].bst>0?.03:0)-(P.bu>0?.04:0),.3,.95)*(mb?.6+.8*qb:1));
      if(R()>=cont){sq+='S';st++}
      else if(R()<.38){sq+='F';if(st<2)st++}
      else{res='play';QQ=qb}
     }else if(zone){sq+='C';st++}else{sq+='B';bl++}
     if(!res){if(st>=3)res='k';else if(bl>=4)res='bb'}
    }
    if(res=='bunt'){add(B,'ab');
     if(R()<.12+B.spd/600){add(B,'h');add(P,'ph');const[a,c,e]=bases;if(e)scr(e,1,0);bases=[B,a,c];txt='toque de hit'}
     else{outs++;add(P,'out');add(B,'ab',-1);const[a,c,e]=bases;if(outs<3){if(e)scr(e,1,0);bases=[null,a,c]}txt='toque de sacrificio'}}
    else if(res=='cs'){ord[b]--;txt='out al intentar robar'}
    else if(res=='k'){add(B,'ab');add(B,'k');add(P,'pk');add(P,'out');outs++;txt='ponche'}
    else if(res=='bb'){add(B,'bb');add(P,'pbb');
     if(bases[0]){if(bases[1]){if(bases[2])scr(bases[2],1,0);bases[2]=bases[1]}bases[1]=bases[0]}
     bases[0]=B;txt='base por bolas'}
    else{
     sq+='X';add(B,'ab');
     const hitP=cl(.295+(B.con-50)/300-(P.mov-50)/400+(QQ-.5)*.2,.15,.5);
     const [b1,b2,b3]=bases;
     let hit=R()<hitP;
     if(hit&&mdf&&dvu[d]<3){const dd=yield{...info(),t:'def'};
      if(dd.a=='dive'){dvu[d]++;if(R()<cl(.05+(dd.q??.5)*.3+(T[d].bat.slice(0,9).reduce((s,p)=>s+p.fld,0)/9-50)/300+.05*Math.max(...T[d].bat.slice(0,9).map(p=>p.sdl||0)),.05,.75)){hit=false;dv=1}else dv=2}}
     if(hit){
      const hr=cl((.10+(B.pow-50)/250)*(.7+.6*QQ)*(1+mod(B,'hr'))*(B.bu>0?1.1:1),.03,.45),x=dv==2&&R()<.4?hr+.1:R();
      add(B,'h');add(P,'ph');
      let ag=0;if(mof&&b1&&x>=hr+.02){const rd=yield{...info(),t:'run'};if(rd.a=='push')ag=1}
      if(x<hr){add(B,'hr');const n=bases.filter(Boolean).length;[b3,b2,b1].forEach(r=>r&&scr(r,1,0));scr(B,1,0);bases=[null,null,null];txt='jonrón'+(n?` de ${n+1} carreras`:'')}
      else if(x<hr+.02){[b3,b2,b1].forEach(r=>r&&scr(r,1,0));bases=[null,null,B];txt='triple'}
      else if(x<hr+.22){b3&&scr(b3,1,0);b2&&scr(b2,1,0);let n3=null;
       if(b1){if(R()<(ag?.68:.45))scr(b1,1,0);else if(ag&&outs<2&&R()<.45){outs++;add(P,'out')}else n3=b1}bases=[null,B,n3];txt='doble'}
      else{b3&&scr(b3,1,0);let n2=null,n3=null;
       if(b2){if(R()<.7)scr(b2,1,0);else n3=b2}
       if(b1){if(!n3&&R()<.25)n3=b1;else n2=b1}
       bases=[B,n2,n3];txt='sencillo';if(ag&&n2&&!n3&&outs<2){if(R()<.62+n2.spd/300){bases[2]=n2;bases[1]=null;txt+=', corredor a 3.ª'}else{bases[1]=null;outs++;add(P,'out');txt+=', corredor out en 3.ª'}}}
     }else if(dv!=1&&R()<.03){
      add(pick(T[d].bat),'e');
      if(b1){if(b2){if(b3)scr(b3,0,1);bases[2]=b2}bases[1]=b1}bases[0]=B;txt='error defensivo'}
     else if(R()<.55){
      if(b1&&outs<2&&R()<.45){outs+=2;add(P,'out',2);
       if(outs<3&&b3)scr(b3,0,0);bases=[null,null,outs<3?b2:null];txt='doble play'}
      else{outs++;add(P,'out');
       if(outs<3&&b3&&R()<.5){scr(b3,1,0);bases[2]=null}txt='rodado, out'}
     }else{outs++;add(P,'out');
      if(outs<3&&b3&&R()<.6){add(B,'ab',-1);scr(b3,1,0);bases[2]=null;txt='elevado de sacrificio'}
      else txt='elevado, out'}
    }
    log.push(`${inn}${b?'▾':'▴'} ${B.name}: ${dv==1?'¡Atrapada espectacular! ':''}${txt} (${sq}) · ${S[0]}-${S[1]}`);
   }
   sc[b][inn-1]=runs;
  }
  if(inn>=9&&S[0]!=S[1])break;
 }
 A.rot++;H.rot++;
 if(!PO){A.rs+=S[0];A.ra+=S[1];H.rs+=S[1];H.ra+=S[0];
 if(S[0]>S[1]){A.w++;H.l++}else if(S[1]>S[0]){H.w++;A.l++}}
 return{A,H,S,sc,log,inn};
}

const sum=(t,k)=>t.bat.reduce((a,p)=>a+(p.g[k]||0),0);
const ip=o=>Math.floor(o/3)+'.'+(o%3);
const avg=(h,ab)=>ab?(h/ab).toFixed(3).replace(/^0/,''):'---';
const era=p=>p.s.out?(p.s.er*27/p.s.out).toFixed(2):'-.--';
const whip=p=>p.s.out?((p.s.ph||0)+(p.s.pbb||0))/(p.s.out/3):99;

const KEY='liga-diamante-v4';let season=null,rx=false,ME=0,FA=[],SM='',NW=[];
const BUD=160,CB=12,CP=8,MB=9,MP=7;
const pay=t=>Math.round(([...t.bat,...t.pit].reduce((a,p)=>a+p.sal,0)+(t.sc||0)*4+(t.co||[]).reduce((a,c)=>a+c.sal,0))*10)/10;
const newFA=n=>{for(let i=0;i<n;i++)FA.push(sign(R()<.55?mkB(pick(POS)):mkP(R()<.6?'SP':'RP'),rnd(1,3)))};
function fill(t,ai){
 for(const k of ['bat','pit']){const min=k=='bat'?MB:MP,isP=k=='pit';
  while(t[k].length<min){const c=FA.filter(p=>!!p.vel==isP).sort((a,b)=>ovr(b)-ovr(a));
   if(!c.length){newFA(8);continue}
   const aff=c.filter(p=>pay(t)+p.sal<=BUD),p=aff.length?aff[0]:c.sort((a,b)=>a.sal-b.sal)[0];
   FA.splice(FA.indexOf(p),1);t[k].push(p)}
  if(ai){const w=t[k].reduce((m,p)=>ovr(p)<ovr(m)?p:m);
   const c=FA.filter(p=>!!p.vel==isP&&ovr(p)>ovr(w)+5&&pay(t)-w.sal+p.sal<=BUD).sort((a,b)=>ovr(b)-ovr(a))[0];
   if(c){FA.splice(FA.indexOf(c),1);t[k].splice(t[k].indexOf(w),1);FA.push(w);t[k].push(c)}
   t[k].sort((a,b)=>ovr(b)-ovr(a));FA.push(...t[k].splice(k=='bat'?CB:CP))}}}
function offseason(){
 [...teams.flatMap(t=>[...t.bat,...t.pit]),...FA].forEach(p=>{prog(p);p.inj=0});FA=FA.filter(p=>!retire(p));[...teams[ME].bat,...teams[ME].pit].forEach(p=>{if(p.rtts)p.tp=(p.tp||0)+6});clubDev();coachRefill();CG={sel:[],goals:[],cand:[],res:CG.res};

function cgEval(){if(!CG.goals.length)return;const n=CG.goals.filter(id=>CGOALS.find(g=>g.id==id).f()).length,g=n*80+(n==3?150:0);GP+=g;SPT+=n;CG.res=`Metas del club: ${n}/3 (+${g} G, +${n} SP)`;season.news.unshift(CG.res);CG.goals=[]}
const TIPS=[['Primeros pasos','Partido: juega exhibiciones automáticas o manuales. Temporada: avanza el calendario y los playoffs. Líderes: clasificación, líderes y récords. Franquicia: tu plantilla, contratos y fichajes. Modos: todo lo demás.'],['Primeros pasos','Tu partida se guarda sola en este navegador. En Modos → Datos puedes exportar una copia a un archivo.'],['Primeros pasos','Gana G jugando, cobra misiones y gasta en la tienda, el Salón y el club.'],
['Partido manual','Toca la barra cuando el marcador esté en la franja verde: cuanto más centrado, más contacto y más poder.'],['Partido manual','Un bunt adelanta a los corredores. Con 2 strikes, un foul de bunt cuenta como ponche.'],['Partido manual','Marca Robar 2.ª o Robar 3.ª antes de batear o dejar pasar la bola.'],['Partido manual','Con corredor en 1.ª y un hit, enviarlo da más carreras, pero puede costarte un out.'],['Partido manual','En defensa tienes 3 intentos por partido para tirarte a atrapar un hit. El tiro especial reduce los robos del rival.'],['Partido manual','Mira la resistencia de tu lanzador y cámbialo antes de que lo castiguen. Los suplentes de la banca sirven de emergentes.'],
['Mi carrera','Los puntos de acción (AP) se recuperan 15 por partido. No los gastes todos si necesitas descansar.'],['Mi carrera','Si tu condición baja de 35 puedes enfermar. El hospital cura enfermedades y lesiones.'],['Mi carrera','Las metas del año dan dinero, G y popularidad: elige las que sí puedes cumplir.'],['Mi carrera','Un lanzador abre cada 5 juegos aproximadamente. Usa los otros días para entrenar y descansar.'],
['Franquicia','El presupuesto es de 160 M$. Las gradas del estadio lo amplían. Un contrato que vence deja al jugador en agentes libres.'],['Franquicia','El draft elige primero el peor equipo. Más scouting reduce el error del techo de los prospectos.'],['Franquicia','Los entrenadores suben atributos al final de cada temporada. Un jugador puede llevar hasta 2 cartas y varios objetos.'],
['Habilidades y cartas','Las habilidades de nivel 2 piden una de nivel 1 y las de nivel 3 piden dos de nivel 2. Cada jugador equipa 3 ranuras, ampliables a 6.'],['Habilidades y cartas','Los 10 sobres garantizan una carta Buena o mejor. Fusionar dos cartas iguales puede subir su rareza.'],['Habilidades y cartas','Diseña hasta 3 pitcheos propios en Modos → Pitcheos. Más quiebre baja el contacto, pero cuesta lanzarlo a la zona.'],
['Derby y torneos','En el Derby, Potencia da más jonrones pero más outs; Contacto es más seguro.'],['Derby y torneos','Los torneos aceptan 4 u 8 equipos y no afectan la temporada.']];
let VN={aff:0,seen:{},fl:{},rv:-1,end:'',ann:{}},VS=null;
const vJ=t=>({w:'j',t}),vN=t=>({w:'n',t}),vP=t=>({w:'p',t}),vW=(w,t)=>({w,t}),vC=a=>({ch:a.map(x=>({t:x[0],a:x[1],r:x[2]}))});
const VNS=[
{id:'s1',n:'Palco VIP',hint:'Juega 2 partidos de tu carrera',need:()=>VP().day>=2||VP().yr>1,nodes:[
 vN('Estadio lleno, tercera jornada. En el palco VIP del %R, rodeada de cámaras, una mujer con chaqueta del equipo y gafas de sol te mira sin disimular. Todo el mundo sabe quién es: Jenny, la madrina del club.'),
 vJ('Así que tú eres el que anda diciendo que mi equipo [[no sabe batear||no sabe lanzar]].'),
 vC([['[[Yo solo dije que su lanzador se cansa en el sexto.||Yo solo dije que su ofensiva se apaga en el sexto.]]',1,[vJ('Qué detalle tan específico. Alguien hace su tarea. Me gusta.')]],['Lo dije y lo sostengo.',2,[vJ('Seguridad y descaro. Peligrosa combinación para un rival.')]],['Perdona, no sabía que el equipo era tuyo.',0,[vJ('Todavía no es del todo mío. Pero llevo una temporada trabajándolo.')]]]),
 vJ('Soy Jenny. Madrina del club, dueña de esta tribuna y, si me caes bien, también de tu mala racha.'),
 vN('Mide uno cincuenta y cinco, pero llena el palco entero. Tiene el porte de quien pasó años frente a una barra de ballet y aprendió que la postura lo es todo.'),
 vJ('Apostemos algo pequeño. Mañana gana el %R. Si pierdo, yo pago el café. Si pierdes tú, me cuentas por qué juegas.'),
 vC([['Trato hecho.',1,[vJ('Perfecto. Los tratos son lo mío.')]],['No apuesto con rivales.',0,[vJ('Prudente. Eso también se respeta. Ya cambiarás de idea.')]]]),
 vN('Al irte, ella ya está otra vez frente a las cámaras, sonriendo como si nada. Pero te miró dos segundos de más.')]},
{id:'s2',n:'Redes en llamas',hint:'Llega al partido 8 de tu carrera',need:()=>VP().day>=8||VP().yr>1,nodes:[
 vN('Antes de la serie contra el %R, la cuenta de Jenny publica una foto desde el palco: «Les dejo una predicción: nos vemos en la final. A los demás, buen viaje». Dos millones de seguidores lo leen, y tu vestuario no habla de otra cosa.'),
 vW('Compañero','Te está provocando a ti, ¿lo ves? Contéstale algo.'),
 vC([['Le respondo en público, con humor.',2,[vN('Escribes: «Gracias por el boleto de ida. Dejen un asiento para la vuelta». En una hora tiene miles de reacciones.'),vJ('(mensaje) Con humor, ¿eh? Veamos si lo mantienes cuando cierren las gradas.')]],['No respondo y me concentro.',1,[vJ('(mensaje) Silencio. Qué táctica. Me tienta ver cuánto te dura.')]],['Le escribo en privado.',2,[vJ('(mensaje) Un mensaje privado a la madrina rival… valiente. Ahora sí tengo curiosidad.')]]]),
 vN('Esa noche aparece una cuenta que se hace pasar por ella y difunde insultos contra tu equipo. No suena como Jenny.'),
 vC([['Le aviso que hay una cuenta falsa.',3,[vJ('(mensaje) Ya la vi. Mi equipo legal está en eso. Gracias por avisar: la mayoría solo habría compartido el escándalo.')]],['Lo ignoro: no es mi problema.',0,[vJ('(mensaje) Ya la borrarán. Gente mala hay en todos lados.')]]]),
 vJ('(mensaje) Los haters nunca descansan. Yo tampoco. Nos vemos en el estadio.')]},
{id:'s3',n:'La piscina del hotel',hint:'Llega al partido 15 de tu carrera',need:()=>VP().day>=15||VP().yr>1,nodes:[
 vN('Gira de visitante. A las seis de la mañana el hotel está en silencio. Bajas a la piscina y alguien ya nada largos con precisión de reloj. Sale del agua con la toalla al cuello: es Jenny.'),
 vJ('Madrugas. Eso es raro en un rival.'),
 vJ('Nado todas las mañanas desde que tenía diez años. Es lo único que no cobro ni subo a redes.'),
 vC([['¿Y el ballet? Leí que estudiaste en Nueva York.',2,[vJ('En la School of American Ballet. Rodillas cansadas y una disciplina que nadie me va a quitar. Todo lo que hago hoy se construye sobre eso.')]],['¿Siempre ganas todo?',1,[vJ('Siempre. Perder me da urticaria.')]],['No quería interrumpir.',0,[vJ('Tranquilo. Interrumpes poco, y ya es mejor que mucha gente.')]]]),
 vJ('Te reto: dos largos. Si me ganas, te presento a mi mejor amigo.'),
 vC([['Acepto el reto.',2,[vN('Te saca medio cuerpo en el primer largo. En el segundo apenas la alcanzas.'),vJ('Casi. [[Buen ritmo para un bateador.||Buen ritmo para un lanzador.]] La próxima vez, entrena más las piernas.')]],['Prefiero verte nadar.',1,[vJ('Elegiste bien. Hoy no estoy para perdonar a nadie.')]]]),
 vJ('Crecí en una casa cristiana, de reglas y de secretos. Aprendí a cuidar mi intimidad como un tesoro. Por eso nado de madrugada: aquí nadie opina.'),
 vN('Se va dejando huellas mojadas en el mármol. No te dio su número, pero sí una hora: las seis de la mañana, mañana.')]},
{id:'s4',n:'Palco de postemporada',hint:'Llega al partido 24 o a la postemporada',need:()=>VP().day>=24||VP().ph!='reg'||VP().yr>1,nodes:[
 vN('Postemporada. El estadio vibra. En el palco, Jenny sostiene un pañuelo del %R y una sonrisa de gato.'),
 vJ('Esta noche mis seguidores juegan contra ti. [[Cada ponche tuyo me cuesta mil comentarios.||Cada ponche que lances me cuesta mil comentarios.]]'),
 vC([['Entonces tendrás muchos comentarios que leer.',2,[vJ('Qué arrogante. [[Dame un jonrón y lo discuto.||Dame una blanqueada y lo discuto.]]')]],['Que gane el mejor.',1,[vJ('El mejor siempre soy yo. Pero acepto el principio.')]]]),
 vN('El partido termina ajustado. Al final, ella baja a la línea de la banda cuando ya casi no queda nadie.'),
 vJ('Perdí un poco de dinero apostando contra ti y gané algo mejor: tu atención.'),
 vJ('Gane quien gane, en este deporte nadie escapa de nadie. Me gusta eso.'),
 vN('Se te acelera el pulso, y no es por el partido.')]},
{id:'s5',n:'El museo',hint:'Empieza el año 2 de tu carrera',need:()=>VP().yr>1&&VP().day>=2,nodes:[
 vN('Sin partidos a la vista, ella te cita en un museo de arte. Sin cámaras, sin chaqueta del club: una gabardina oscura y el pelo recogido en dos moños.'),
 vJ('Vengo a perderme aquí cada vez que me abruma el ruido. Los cuadros no juzgan.'),
 vC([['¿Cuál es tu favorito?',2,[vJ('Un paisaje caribeño de un pintor boricua. Me recuerda a mi abuela, a la isla, a lo que dejé atrás por construir mi propio camino.')]],['No sé nada de arte.',1,[vJ('Mejor: no tienes prejuicios. Te enseño.')]]]),
 vJ('Tengo una lista de viajes: Kioto en primavera, la Patagonia, un safari en Kenia. Algún día los tacho todos.'),
 vC([['Te acompaño a Kioto.',3,[vJ('Cuidado con lo que prometes. Yo lo anoto todo.')]],['Te recomiendo alguna ruta.',1,[vJ('Siempre práctico. Anotado.')]]]),
 vJ('Mi herencia es mixta: comida, ritmos, familia. Cocino platos de tres países. Si algún día cocino para ti, sabrás que pasaste de rival a algo más.')]},
{id:'s6',n:'Zeus',hint:'Año 2, partido 6',need:()=>VP().yr>1&&VP().day>=6,nodes:[
 vN('Un parque al amanecer. Un pastor alemán enorme corre hacia ti, se detiene en seco y se sienta con la lengua afuera.'),
 vJ('Zeus. Es el único de mi vida que nunca me ha pedido nada.'),
 vJ('Dono a tres refugios y apadrino a doce perros. Los animales no mienten.'),
 vC([['Zeus parece de los míos.',2,[vN('Zeus apoya la cabeza en tu rodilla. Jenny sonríe sin cámara delante.')]],['Yo soy más de gatos.',0,[vJ('Entonces te falta aprender. Zeus será tu profesor.')]]]),
 vJ('A los cuarenta y dos sé exactamente lo que quiero. Y lo que no: gente que me vea como un titular.'),
 vC([['Yo te veo como Jenny.',3,[vJ('Eso… eso no lo dice casi nadie.')]],['No me importan los titulares.',1,[vJ('Ya veremos cuando se te acaben los dedos para contar los rumores.')]]])]},
{id:'s7',n:'Prensa amarilla',hint:'Año 2, partido 12',need:()=>VP().yr>1&&VP().day>=12,nodes:[
 vN('Un portal de chismes publica: «Jenny se retira y oculta una grave enfermedad». Todo es falso. Tu teléfono se llena de mensajes.'),
 vJ('Otra vez. Cada seis meses inventan algo. Antes me dolía; ahora hago cuentas: cada rumor me sube las métricas.'),
 vN('Su voz es firme, pero sus manos se aprietan alrededor del teléfono.'),
 vC([['Publico una defensa en mis redes.',3,[vJ('Tu gesto llegará más lejos que cualquier comunicado. Pero cuidado: ahora te van a buscar a ti.')]],['Me quedo a tu lado, sin hacer ruido.',3,[vJ('A veces eso vale más que mil mensajes.')]],['Quizá deberías desmentirlo tú.',1,[vJ('Lo haré. Pero hoy necesitaba que alguien me escuchara. Ya lo hiciste.')]]]),
 vJ('Hay quien me juzga por mi trabajo. Pero yo escribo mis reglas, firmo mis contratos y pago mis cuentas. No le debo nada a nadie.')]},
{id:'s8',n:'Final de temporada',hint:'Final del año 2 de tu carrera',need:()=>VP().yr>1&&(VP().day>=24||VP().ph!='reg'),nodes:[
 vN('Fin de temporada. Jenny te espera en el palco vacío con dos tazas de café.'),
 vJ('%P, hace meses apostamos un café. Todavía no sé si te lo debo yo o me lo debes tú. Perdí la cuenta.'),
 {if:v=>v.aff>=20,r:[vJ('No quiero más rivalidades entre nosotros. Quiero que seas mi compañero, dentro y fuera del estadio.'),vN('Es la primera vez que ves sus ojos sin gafas ni cámaras. Dices que sí.')]},
 {if:v=>v.aff>=12&&v.aff<20,r:[vJ('Eres mi mejor rival y probablemente mi mejor amigo. No cambies eso.'),vN('Brindan con el café. Hay mucho dicho y todavía más por decir.')]},
 {if:v=>v.aff<12,r:[vJ('Seguimos siendo rivales. Pero rivales con respeto, que es lo más raro de este deporte.'),vN('Se va con la barbilla en alto. Algo te dice que volverás a cruzarte con ella.')]}]}];

function jav(w,big){return JIMG.s?`<img src="${big?JIMG.l:JIMG.s}" alt="Jenny" width="${w}" style="flex:none;background:var(--bg);border-radius:10px;height:auto">`:'♥'}
function VP(){return MBS?{yr:MBS.yr,day:MBS.phase=='reg'?MBS.day:45,ph:MBS.phase}:{yr:0,day:-1,ph:''}}
function vnRival(){const L=MBS?MBS.L:teams,me=MBS?MBS.ti:ME;if(VN.rv<0||VN.rv==me||!L[VN.rv])VN.rv=[...L.keys()].filter(i=>i!=me).sort((a,b)=>L[b].w-L[a].w)[0];return L[VN.rv].n}
const vnTxt=t=>t.replace(/\[\[(.*?)\|\|(.*?)\]\]/g,(m,a,b)=>MBS&&MBS.kind=='pit'?b:a).replace(/%R/g,vnRival()).replace(/%P/g,MBS?MBS.p.name:'campeón');
function vnAvail(s){const i=VNS.indexOf(s);return!VN.seen[s.id]&&(i==0||!!VN.seen[VNS[i-1].id])&&s.need()}
function vnNext(){if(!VS)return;while(VS.q.length){const n=VS.q.shift();if(n.if){if(n.if(VN))VS.q.unshift(...n.r);continue}VS.cur=n;return}VS.cur=null;vnFinish()}
function vnStart(id){const s=VNS.find(x=>x.id==id);if(!s)return;const rep=!!VN.seen[id];if(!rep&&!vnAvail(s))return;VS={id,q:[...s.nodes],cur:null,rep};vnNext()}
function vnChoose(i){const n=VS&&VS.cur;if(!n||!n.ch)return;const c=n.ch[i];if(!c)return;if(!VS.rep)VN.aff+=c.a;VS.q.unshift(...c.r);vnNext()}
function vnFinish(){const s=VNS.find(x=>x.id==VS.id);if(!VS.rep){VN.seen[s.id]=1;GP+=40;SPT+=1;if(s.id=='s8'){VN.end=VN.aff>=20?'Pareja':VN.aff>=12?'Aliados cercanos':'Rivales con respeto';GP+=300;SPT+=3}}VS=null}
function vnCheck(){VNS.forEach(s=>{if(!VN.ann[s.id]&&vnAvail(s)){VN.ann[s.id]=1;if(MBS)MBS.msg='Historia: nueva escena con Jenny ('+s.n+')'}})}
function rel(k,i){const t=teams[ME],min=k=='bat'?MB:MP;if(t[k].length<=min)return`Necesitas al menos ${min} ${k=='bat'?'bateadores':'lanzadores'}`;const p=t[k].splice(i,1)[0];stripAll(p);p.sal=mkt(p);p.yrs=rnd(1,3);FA.push(p);return p.name+' liberado'}
function fich(j){const t=teams[ME],p=FA[j],k=p.vel?'pit':'bat';if(t[k].length>=(k=='bat'?CB:CP))return'Plantilla llena: libera a alguien';if(pay(t)+p.sal>BUD+STD.grad*3)return'No cabe en el presupuesto';cnt('fa');t[k].push(FA.splice(j,1)[0]);return p.name+' fichado'}
function mv(k,i,d){const a=teams[ME][k],j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]]}
function mkSched(nc){const n=8,days=[];
 for(let c=0;c<(nc||4);c++){const arr=[...Array(n).keys()];
  for(let r=0;r<n-1;r++){const day=[];
   for(let i=0;i<n/2;i++){const x=arr[i],y=arr[n-1-i];day.push((i+r+c)%2?[x,y]:[y,x])}
   days.push(day);arr.splice(1,0,arr.pop())}}
 return days}
function newSeason(yr,hist){
 teams.forEach(t=>{t.w=t.l=t.rs=t.ra=0;[...t.bat,...t.pit].forEach(p=>{p.c=p.c||{};for(const k in p.s)p.c[k]=(p.c[k]||0)+p.s[k];p.s={}})});
 season={yr,day:0,sched:mkSched(),phase:'reg',last:[],seeds:[],rounds:[],champ:null,awards:null,hist:hist||[],news:NW.splice(0)}}
function stateObj(){return{v:4,teams,season,fa:FA,me:ME,rec:REC,mb:MBS,gp:GP,inv:INV,ct:CT,mi:MI,spt:SPT,tt:TT,cds:CARDS,std:STD,cld:CLD,cop:COP,cg:CG,vn:VN}}
function exportJSON(){if(MBS&&MBS.st)return'!Termina el partido de Mi carrera antes de exportar';return JSON.stringify(stateObj())}
function importText(t){let d;try{d=JSON.parse(t)}catch(e){return'El archivo no es un JSON válido'}
 if(!d||!Array.isArray(d.teams)||d.teams.length!=8||!d.season||!d.teams.every(x=>x&&Array.isArray(x.bat)&&Array.isArray(x.pit)&&x.bat.length>=9&&x.pit.length>=7))return'El archivo no es una partida de Liga Diamante';
 const bk=JSON.stringify(stateObj());try{if(!applyState(d))throw 0;save();return'ok'}catch(e){applyState(JSON.parse(bk));return'No se pudo importar el archivo'}}
function save(){if(MBS&&MBS.st)return;tCheck();vnCheck();try{localStorage.setItem(KEY,JSON.stringify(stateObj()))}catch(e){}}
function load(){try{return applyState(JSON.parse(localStorage.getItem(KEY)||'null'))}catch(e){}return false}
function applyState(d){try{if(d&&d.teams&&d.season){teams.splice(0,teams.length,...d.teams);season=d.season;FA=d.fa||[];ME=d.me||0;REC=d.rec||{derby:[]};GP=d.gp??200;INV=d.inv||[];CT=d.ct||{};MI=d.mi||[];SPT=d.spt??3;TT=d.tt||{u:{},e:''};CARDS=d.cds||[];STD=d.std||{conc:0,grad:0,lab:0,cam:0};CLD=d.cld??1;COP=d.cop||[];CG=d.cg||{sel:[],goals:[],cand:[],res:''};VN=d.vn||{aff:0,seen:{},fl:{},rv:-1,end:'',ann:{}};MBS=d.mb||null;if(MBS){MBS.st=null;MBS.g_=null;MBS.ctl=null;MBS.p=MBS.L[MBS.ti][MBS.kind=='pit'?'pit':'bat'].find(x=>x.mbp)||MBS.p;Object.assign(MBS,{kind:MBS.kind||'bat',dif:MBS.dif??1,ap:MBS.ap??40,money:MBS.money??1000,dis:MBS.dis||0,lk:MBS.lk||null,injN:MBS.injN||0,sel:MBS.sel||[],goals:MBS.goals||[],gtot:MBS.gtot||0,cand:MBS.cand||[]});if(!MBS.cand.length)MBS.cand=mbCand()}return true}}catch(e){}return false}
function endReg(){
 const all=teams.flatMap(t=>t.bat.map(p=>({p,t}))),pits=teams.flatMap(t=>t.pit.map(p=>({p,t})));
 const top=(a,f)=>a.reduce((m,x)=>f(x)>f(m)?x:m,a[0]),lb=x=>`${x.p.name} (${x.t.n})`;
 const mv=x=>{const s=x.p.s;return (s.h||0)+3*(s.hr||0)+(s.rbi||0)+(s.r||0)+.5*(s.bb||0)+(s.sb||0)-.2*(s.k||0)};
 const cy=x=>{const s=x.p.s;return (s.out||0)/3-2*(s.er||0)+.3*(s.pk||0)-.3*((s.ph||0)+(s.pbb||0))};
 season.awards={mvp:lb(top(all,mv)),cy:lb(top(pits,cy)),hr:lb(top(all,x=>x.p.s.hr||0)),
  roy:(()=>{const r=all.filter(x=>x.p.rk===season.yr&&(x.p.s.ab||0)>0);return r.length?lb(top(r,mv)):'Sin novatos con juego'})(),
  gg:POS.filter(q=>q!='DH').map(q=>{const w=top(all.filter(x=>x.p.pos==q),x=>x.p.fld-4*(x.p.s.e||0));return{pos:q,n:lb(w)}})};
 season.seeds=[...teams.keys()].sort((a,b)=>teams[b].w-teams[a].w||(teams[b].rs-teams[b].ra)-(teams[a].rs-teams[a].ra)).slice(0,4);
 updRec();season.phase='po'}
function playDay(){if(season.phase!='reg')return;
 season.last=season.sched[season.day].map(([a,h])=>{const g=playGame(teams[a],teams[h]);if(a==ME||h==ME){const w=sHook(g,a==ME?0:1);GP+=Math.round((w?40:15)*[1.3,1,.8][CLD])+STD.conc*6}return `${teams[a].n} ${g.S[0]}, ${teams[h].n} ${g.S[1]}`+(g.inn>9?` (${g.inn})`:'')});
 tick();if(++season.day>=season.sched.length)endReg()}
function series(a,b,need){let wa=0,wb=0,i=0;PO=true;
 try{while(wa<need&&wb<need){const hm=i++%2?b:a,aw=hm==a?b:a;let g;do g=playGame(teams[aw],teams[hm]);while(g.S[0]==g.S[1]);
  if((hm==a)==(g.S[1]>g.S[0]))wa++;else wb++}}finally{PO=false}
 return{a,b,wa,wb,w:wa>wb?a:b}}
function playRound(){const s=season;if(s.phase!='po')return;const q=s.seeds;

<div class="sc" style="padding:8px 10px">${SLOT[k].map(s=>{const it=p.it&&p.it[s[0]];return`${s[1]}: ${it?`${it.n} (+${it.v} ${it.st}) <button class="alt" data-te="u,${s[0]}">Quitar</button>`:'—'}`}).join('<br>')}<br>Habilidades: ${eqs(p).map(x=>(SK[x]||{n:x}).n).join(', ')||'—'}</div>
<h2>Inventario</h2><div class="sc">${INV.map((it,i)=>it.k==k?`<div class="ser"><span>${it.n} (+${it.v} ${it.st})</span><button data-te="e,${i}">Equipar</button></div>`:'').join('')||'<div class="ser"><span>Sin objetos compatibles</span></div>'}</div>

<h2>Objetos en venta</h2><div class="sc">${cat(k).map(it=>`<div class="ser"><span>${it.n} (+${it.v} ${it.st})</span><button class="alt" data-te="b,${it.id}">${it.pr} G</button></div>`).join('')}</div>`}
 function tClick(a){const[c,v]=a.split(','),p=selP();TMSG='';
  if(c=='b')TMSG=buy(v);else if(p&&c=='e')TMSG=equip(p,+v);else if(p&&c=='u'){unequip(p,v);TMSG='Objeto quitado'}else if(p&&c=='l')TMSG=learn(p,v)}
 $('mo').onchange=e=>{if(e.target.id=='ts'){SEL=e.target.value;TMSG='';MD=='h'?hview():MD=='p'?pview():MD=='f'?fview():tview()}};

 document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
